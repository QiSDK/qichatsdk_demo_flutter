name: qichat_ui_sdk
description: "QiChat UISDK - 一层 UI + 状态编排，把 flutter_qichat_sdk 协议层封装成可被其它 Flutter App 直接调用的客服 UI（客服列表 + 聊天页）。"
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  mobx: ^2.1.3
  flutter_mobx: ^2.0.6+5
  #qichatsdk_flutter: ^1.3.2
  flutter_qichat_sdk: ^2.0.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  # 网络
  dio: ^5.7.0
  dio_cache_interceptor: ^3.4.2
  dio_cache_interceptor_hive_store: ^3.2.1
  pretty_dio_logger: ^1.1.1
  provider: ^6.0.3
  # image
  cached_network_image: ^3.4.0
  # 文件位置
  path_provider: ^2.0.11
  flutter_svg: ^2.0.5
  loading_animation_widget: ^1.2.0+2
  # 日期格式化
  date_format: ^2.0.6
  package_info_plus: ^7.0.0
  throttling: ^2.0.1
  lottie: ^2.4.0
  easy_refresh: ^3.4.0
  flutter_smart_dialog: ^4.9.4
  easy_debounce: ^2.0.3
  connectivity_plus: ^6.1.0
  flutter_statusbarcolor_ns: ^0.6.0
  path: ^1.8.3
  logman: ^0.0.16
  uuid: ^4.5.1
  flutter_chat_ui: ^1.6.13
  flutter_chat_types: ^3.6.2
  image_picker: ^1.1.2
  super_tooltip: ^2.0.9
  clipboard: ^0.1.3
  video_player: ^2.9.2
  video_player_win: ^3.1.1
  chewie: ^1.8.5
  emoji_picker_flutter: ^2.2.0
  window_manager: ^0.4.3
  #get_thumbnail_video: ^0.6.1
  #ffmpeg_kit_flutter_full_gpl: ^5.1.0
  webview_flutter: ^4.9.0
  webview_flutter_wkwebview: ^3.14.0
  webview_flutter_android: 3.16.0
  macos_webview_kit: ^0.0.3
  #auto_scroll: ^0.2.0
  camera: ^0.10.5+9
  wechat_assets_picker: ^9.5.1
  pdfrx: ^1.0.94
  flutter_html: ^3.0.0-beta.2
  # 历史归在 dev_dependencies，但 article_repository / custom_bottom 在运行时
  # 真的会引用，移到 dependencies 才能在外部消费时传递过来。
  downloadsfolder: ^1.1.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  mobx_codegen: ^2.6.0+1
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/png/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
